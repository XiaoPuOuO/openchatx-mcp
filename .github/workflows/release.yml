name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        type: string
      skip_validation:
        description: Skip the release tag/package validation step
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: 22.18.0
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref_name }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v4
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_validation) }}
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_validation) }}
        run: npm ci --force
      - if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_validation) }}
        run: npm --prefix ui ci
      - if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_validation) }}
        run: npm run setup -- --config-only
      - name: Verify tag matches package version
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_validation) }}
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          test "$VERSION" = "$RELEASE_TAG"
      - name: Validate source quality
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_validation) }}
        run: |
          npm run lint
          npm run typecheck
          npm --prefix ui run lint
          npm run build
          npm --prefix ui run build

  macos:
    name: macOS ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: brew install ripgrep
      - run: npm ci
      - run: npm --prefix ui ci
      - run: npm run setup -- --config-only
      - name: Isolated test files
        timeout-minutes: 10
        run: npm run test:ci
      - name: Verify Apple signing secrets
        shell: bash
        run: |
          test -n "$APPLE_CERTIFICATE_P12_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_NOTARY_KEY_P8_BASE64"
          test -n "$APPLE_NOTARY_KEY_ID"
          test -n "$APPLE_NOTARY_ISSUER_ID"
      - name: Import Developer ID certificate
        shell: bash
        run: |
          KEYCHAIN="$RUNNER_TEMP/openchatx.keychain-db"
          CERT="$RUNNER_TEMP/openchatx.p12"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p openchatx "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p openchatx "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k openchatx "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
      - name: Configure Apple notarization
        shell: bash
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEY"
          xcrun notarytool store-credentials openchatx-notary \
            --key "$KEY" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID"
      - name: Build signed/notarized desktop
        run: npm run desktop:notarize
      - run: npm run desktop:smoke
      - name: Name release artifacts
        shell: bash
        run: |
          mv dist-desktop/OpenChatX.dmg "dist-desktop/OpenChatX-macos-${{ matrix.arch }}.dmg"
          ditto -c -k --keepParent dist-desktop/OpenChatX.app "dist-desktop/OpenChatX-macos-${{ matrix.arch }}.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            dist-desktop/OpenChatX-macos-${{ matrix.arch }}.dmg
            dist-desktop/OpenChatX-macos-${{ matrix.arch }}.app.zip
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - run: npm ci
      - run: npm --prefix ui ci
      - run: npm run setup -- --config-only
      - name: Windows platform tests
        run: node --import tsx --test test/host-platform.test.ts test/config.test.ts test/state-setup.test.ts test/schema-compatibility.test.ts test/desktop-runtime.test.ts
      - name: Build unsigned desktop and installer
        run: node --import tsx scripts/desktop-windows.ts installer ${{ matrix.arch }}
      - name: Smoke test x64 runtime
        if: matrix.arch == 'x64'
        run: npm run desktop:windows:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: |
            dist-desktop/OpenChatX-windows-${{ matrix.arch }}.zip
            dist-desktop/windows-installer/OpenChatX-Setup-${{ matrix.arch }}.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh release create "$RELEASE_TAG" "${assets[@]}" --target "$GITHUB_SHA" --generate-notes --title "OpenChatX $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --generate-notes --title "OpenChatX $RELEASE_TAG"
          fi
