name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            uname: arm64
          - arch: x64
            runner: macos-15-intel
            uname: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.uname }}"
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run setup -- --config-only
      - name: Create default test workspace
        run: node -e "require('node:fs').mkdirSync(require('node:path').join(require('node:os').homedir(),'Desktop','agent-workspace'),{recursive:true})"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows:
    name: validate (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run setup -- --config-only
      - name: Create default test workspace
        run: node -e "require('node:fs').mkdirSync(require('node:path').join(require('node:os').homedir(),'Desktop','agent-workspace'),{recursive:true})"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Windows platform tests
        run: node --import tsx --test test/host-platform.test.ts test/config.test.ts test/setup-workspace.test.ts test/schema-compatibility.test.ts
