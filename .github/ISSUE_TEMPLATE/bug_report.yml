name: Bug report
description: Report a reproducible problem with OpenChatX
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For security vulnerabilities, use the private reporting flow described in `SECURITY.md` instead of this form.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior you saw and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Run ...
        2. Call ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.x or Windows 11 24H2"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "22.18.0"
    validations:
      required: true

  - type: input
    id: chrome
    attributes:
      label: Chrome version
      description: Required only for browser subagent issues.

  - type: input
    id: chatgpt
    attributes:
      label: ChatGPT plan/workspace
      description: For example Business, Enterprise, or Edu. Do not include account identifiers.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Setup / startup
        - Persistent shell
        - apply_patch
        - Web fetch
        - Computer Use / Peekaboo
        - Browser subagents
        - MCP transport / authentication
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Remove tokens, private URLs, personal paths, and other sensitive data before posting.
      render: shell
