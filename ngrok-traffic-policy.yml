on_http_request:
  - expressions:
      - "!('com.openai.chatgpt' in conn.client_ip.categories)"
    actions:
      - type: deny
        config:
          status_code: 403
  - expressions:
      - "req.url.path != '/mcp'"
    actions:
      - type: deny
        config:
          status_code: 404
  - actions:
      - type: remove-headers
        config:
          headers:
            - x-openchatx-remote
      - type: add-headers
        config:
          headers:
            host: localhost
            x-openchatx-remote: "1"
