<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>How Shellby MCP turns ChatGPT Web into a local computer agent</title>
    <style>
      :root {
        --page: #0a0a0a;
        --paper: #141414;
        --bar: #1b1b1b;
        --border: #2b2b2b;
        --ink: #f5f5f5;
        --muted: #9a9a9a;
        --soft: #5c5c5c;
        --accent: #ff5a36;
        --accent-tint: rgba(255, 90, 54, 0.12);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        background: var(--page);
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .terminal {
        max-width: 960px;
        margin: 0 auto;
        overflow: hidden;
        background: var(--paper);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .titlebar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 16px;
        background: var(--bar);
        border-bottom: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
      }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--soft); }
      .dot.accent { background: var(--accent); }
      .name { margin-left: 8px; }
      .frame { padding: 20px 24px 24px; }
      .prompt { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
      .prompt strong { color: var(--accent); font-weight: 600; }
      h1 { margin: 0 0 12px; font-size: 20px; line-height: 1.3; }
      svg { display: block; width: 100%; height: auto; }
    </style>
  </head>
