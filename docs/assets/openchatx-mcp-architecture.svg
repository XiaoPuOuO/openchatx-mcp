<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="shellby-mcp-architecture-title shellby-mcp-architecture-desc" role="img" viewBox="0 0 960 488"><title id="shellby-mcp-architecture-title">How Shellby MCP turns ChatGPT Web into a local computer agent</title><desc id="shellby-mcp-architecture-desc">ChatGPT Web reaches the context-optimized Shellby MCP harness through an ngrok trust boundary, then uses persistent shells, file and web tools, Computer Use, and parallel ChatGPT agents on the local computer, with the multi-agent runtime looping back through ChatGPT Web.</desc><defs><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}</style><marker id="arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon fill="#9a9a9a" points="0 0 8 3 0 6"/></marker><marker id="arrow-accent" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon fill="#ff5a36" points="0 0 8 3 0 6"/></marker><marker id="arrow-link" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon fill="#9a9a9a" points="0 0 8 3 0 6"/></marker></defs><rect width="960" height="488" fill="#141414"/><rect width="192" height="136" x="200" y="152" fill="rgba(106,149,216,0.06)" stroke="#6a95d8" stroke-dasharray="4 4" stroke-width="1" rx="8"/><rect width="112" height="16" x="216" y="156" fill="#141414" rx="4"/><text x="272" y="168" fill="#8fb7ef" font-size="8" letter-spacing="1.2" text-anchor="middle">TRUST BOUNDARY</text><line x1="184" x2="216" y1="220" y2="220" stroke="#9a9a9a" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="376" x2="408" y1="220" y2="220" stroke="#ff5a36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><path fill="none" stroke="#9a9a9a" stroke-width="1.2" marker-end="url(#arrow)" d="M 600 172 H 620 Q 628 172 628 164 V 88 Q 628 80 636 80 H 704"/><path fill="none" stroke="#9a9a9a" stroke-width="1.2" marker-end="url(#arrow)" d="M 600 204 H 644 Q 652 204 652 196 V 192 Q 652 184 660 184 H 704"/><path fill="none" stroke="#9a9a9a" stroke-width="1.2" marker-end="url(#arrow)" d="M 600 236 H 644 Q 652 236 652 244 V 280 Q 652 288 660 288 H 704"/><path fill="none" stroke="#9a9a9a" stroke-width="1.2" marker-end="url(#arrow)" d="M 600 268 H 620 Q 628 268 628 276 V 384 Q 628 392 636 392 H 704"/><path fill="none" stroke="#9a9a9a" stroke-dasharray="5 4" stroke-width="1" marker-end="url(#arrow)" d="M 820 428 V 440 Q 820 448 812 448 H 112 Q 104 448 104 440 V 260"/><rect width="160" height="80" x="24" y="180" fill="#141414" rx="8"/><rect width="160" height="80" x="24" y="180" fill="rgba(255,255,255,0.02)" stroke="#5c5c5c" stroke-width="1" rx="8"/><text x="104" y="216" fill="#f5f5f5" font-size="12" font-weight="600" text-anchor="middle">ChatGPT Web</text><text x="104" y="236" fill="#9a9a9a" font-size="8" text-anchor="middle">remote agent client</text><rect width="160" height="80" x="216" y="180" fill="#141414" rx="8"/><rect width="160" height="80" x="216" y="180" fill="rgba(255,255,255,0.02)" stroke="#5c5c5c" stroke-width="1" rx="8"/><text x="296" y="216" fill="#f5f5f5" font-size="12" font-weight="600" text-anchor="middle">ngrok</text><text x="296" y="236" fill="#9a9a9a" font-size="8" text-anchor="middle">ChatGPT-origin filter</text><rect width="192" height="160" x="408" y="140" fill="#141414" rx="8"/><rect width="192" height="160" x="408" y="140" fill="rgba(255,90,54,0.12)" stroke="#ff5a36" stroke-width="1.2" rx="8"/><text x="504" y="196" fill="#f5f5f5" font-size="16" font-weight="700" text-anchor="middle">Shellby MCP</text><text x="504" y="220" fill="#9a9a9a" font-size="8" text-anchor="middle">AGENT HARNESS</text><text x="504" y="244" fill="#9a9a9a" font-size="8" text-anchor="middle">persistent runtime · MCP transport</text><text x="504" y="264" fill="#9a9a9a" font-size="8" text-anchor="middle">compact output · token-aware</text><rect width="232" height="72" x="704" y="44" fill="#141414" rx="8"/><rect width="232" height="72" x="704" y="44" fill="rgba(255,255,255,0.02)" stroke="#5c5c5c" stroke-width="1" rx="8"/><text x="820" y="76" fill="#f5f5f5" font-size="12" font-weight="600" text-anchor="middle">Persistent shells</text><text x="820" y="96" fill="#9a9a9a" font-size="8" text-anchor="middle">cwd · env · shell state</text><rect width="232" height="72" x="704" y="148" fill="#141414" rx="8"/><rect width="232" height="72" x="704" y="148" fill="rgba(255,255,255,0.02)" stroke="#5c5c5c" stroke-width="1" rx="8"/><text x="820" y="180" fill="#f5f5f5" font-size="12" font-weight="600" text-anchor="middle">File + web tools</text><text x="820" y="200" fill="#9a9a9a" font-size="8" text-anchor="middle">apply_patch · fetch_website</text><rect width="232" height="72" x="704" y="252" fill="#141414" rx="8"/><rect width="232" height="72" x="704" y="252" fill="rgba(255,255,255,0.02)" stroke="#5c5c5c" stroke-width="1" rx="8"/><text x="820" y="284" fill="#f5f5f5" font-size="12" font-weight="600" text-anchor="middle">Computer Use</text><text x="820" y="304" fill="#9a9a9a" font-size="8" text-anchor="middle">apps · screenshots · input</text><rect width="232" height="72" x="704" y="356" fill="#141414" rx="8"/><rect width="232" height="72" x="704" y="356" fill="rgba(255,255,255,0.02)" stroke="#5c5c5c" stroke-width="1" rx="8"/><text x="820" y="388" fill="#f5f5f5" font-size="12" font-weight="600" text-anchor="middle">Multi-agent runtime</text><text x="820" y="408" fill="#9a9a9a" font-size="8" text-anchor="middle">parallel ChatGPT agents</text><line x1="24" x2="936" y1="476" y2="476" stroke="#2b2b2b" stroke-width="1"/><text x="24" y="472" fill="#5c5c5c" font-size="8" letter-spacing="1.2">CURRENT RELEASE: LOCAL EXECUTION ON APPLE SILICON MACOS</text></svg>
